# Production-oriented stack for VPS (Podman/Docker Compose) — DB Auditor.
# Secrets via env file — never commit real credentials.
#
#   podman compose -f deploy/compose.prod.yaml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - snapshot-store:/var/lib/postgresql
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    networks: [auditor]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../backend
      dockerfile: Containerfile
    restart: unless-stopped
    env_file:
      - path: ../.env.prod
        required: true
    environment:
      AUDITOR_HTTP_ADDRESS: :8080
      AUDITOR_METRICS_ADDRESS: :9090
      AUDITOR_MIGRATIONS_DIR: /migrations
      AUDITOR_DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-db_auditor}?sslmode=disable
      AUDITOR_STATEMENT_TIMEOUT: ${AUDITOR_STATEMENT_TIMEOUT:-15s}
      AUDITOR_LOCK_TIMEOUT: ${AUDITOR_LOCK_TIMEOUT:-5s}
      AUDITOR_APPLICATION_NAME: db-auditor
      AUDITOR_LOG_FORMAT: ${AUDITOR_LOG_FORMAT:-json}
      AUDITOR_LOG_LEVEL: ${AUDITOR_LOG_LEVEL:-info}
      AUDITOR_BOOTSTRAP_USER: ${AUDITOR_BOOTSTRAP_USER:?set AUDITOR_BOOTSTRAP_USER in .env.prod}
      AUDITOR_BOOTSTRAP_PASSWORD: ${AUDITOR_BOOTSTRAP_PASSWORD:?set AUDITOR_BOOTSTRAP_PASSWORD in .env.prod}
      AUDITOR_CORS_ORIGINS: ${AUDITOR_CORS_ORIGINS:?set AUDITOR_CORS_ORIGINS in .env.prod}
      AUDITOR_TARGET_ALLOWED_HOSTS: ${AUDITOR_TARGET_ALLOWED_HOSTS:?set AUDITOR_TARGET_ALLOWED_HOSTS in .env.prod}
      AUDITOR_DATABASE_DENYLIST: ${AUDITOR_DATABASE_DENYLIST:-template0,template1,postgres}
      AUDITOR_SCHEMA_DENYLIST: ${AUDITOR_SCHEMA_DENYLIST:-pg_catalog,information_schema}
      AUDITOR_COLUMN_STATS_ENABLED: ${AUDITOR_COLUMN_STATS_ENABLED:-true}
      AUDITOR_COLUMN_STATS_LIMIT: ${AUDITOR_COLUMN_STATS_LIMIT:-5000}
      AUDITOR_WORKLOAD_ENABLED: ${AUDITOR_WORKLOAD_ENABLED:-true}
      AUDITOR_WORKLOAD_LIMIT: ${AUDITOR_WORKLOAD_LIMIT:-500}
      AUDITOR_MAX_CONCURRENT_RUNS: ${AUDITOR_MAX_CONCURRENT_RUNS:-2}
      AUDITOR_MAX_COLLECTOR_WORKERS: ${AUDITOR_MAX_COLLECTOR_WORKERS:-4}
      AUDITOR_MAX_DATABASE_CONNECTIONS: ${AUDITOR_MAX_DATABASE_CONNECTIONS:-4}
      AUDITOR_OPTIONAL_COLLECTOR_TIMEOUT: ${AUDITOR_OPTIONAL_COLLECTOR_TIMEOUT:-2m}
      AUDITOR_TARGET_STATEMENT_TIMEOUT: ${AUDITOR_TARGET_STATEMENT_TIMEOUT:-15s}
    networks: [auditor]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    restart: unless-stopped
    networks: [auditor]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      AUDITOR_DOMAIN: ${AUDITOR_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [auditor]
    depends_on:
      - api
      - frontend

networks:
  auditor:
    driver: bridge

volumes:
  snapshot-store:
  caddy-data:
  caddy-config:
