# One-shot: renames Go module path on this branch then self-disables via commit.
# Safe to delete after module path is github.com/mayconmendes-qc/db-auditor.
name: rename-module-once
on:
  workflow_dispatch:
  push:
    branches: [chore/sanitize-82-88]
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply module path rename if needed
        run: |
          set -e
          if ! grep -q 'module github.com/mayconmendes-qc/timescale-auditor' backend/go.mod; then
            echo "already renamed"
            exit 0
          fi
          find backend -name '*.go' -print0 | xargs -0 sed -i 's|mayconmendes-qc/timescale-auditor|mayconmendes-qc/db-auditor|g'
          sed -i 's|module github.com/mayconmendes-qc/timescale-auditor|module github.com/mayconmendes-qc/db-auditor|' backend/go.mod
          # residual product comment in baseline
          sed -i '1s/Timescale Auditor/DB Auditor/' backend/migrations/01_baseline.sql || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: module path github.com/mayconmendes-qc/db-auditor (#82)"
          git push
